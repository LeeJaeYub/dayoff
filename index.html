<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>한국 연차 최적화 계산기 (Toss Style)</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="logo">
        <span>🎈</span> 연차최적화
      </div>
      <div class="nav-links">
        <button id="sound-toggle">🔊 소리 켬</button>
      </div>
    </header>

    <main>
      <!-- 인트로 타이틀 -->
      <section class="intro-section">
        <h1>남은 연차가 몇 일인가요?</h1>
        <p>가장 길게 쉴 수 있는 일정을 계산할게요.</p>
      </section>

      <!-- 🎡 드럼 피커 섹션 -->
      <section class="picker-section">
        <span class="picker-label">사용할 연차 일수</span>
        <div class="drum-picker-container">
          <div class="picker-center-bar"></div>
          <div class="drum-picker" id="drum-picker">
            <!-- 드럼 피커 항목들이 JS에 의해 동적으로 생성됨 -->
          </div>
        </div>
      </section>

      <!-- 🗂 결과 카드 섹션 -->
      <section class="results-section">
        <h2 class="section-title">✨ 연휴 추천 일정</h2>
        <div id="results-container">
          <!-- 추천 카드가 JS에 의해 실시간 렌더링됨 -->
        </div>
      </section>

      <!-- 📅 캘린더 섹션 -->
      <section class="calendar-section" id="calendar-section">
        <h2 class="section-title">📅 달력으로 보기</h2>
        
        <!-- 캘린더 설명 범례 (Legend) -->
        <div class="calendar-legend">
          <div class="legend-item">
            <div class="legend-color leave"></div>
            <span>내 연차 사용</span>
          </div>
          <div class="legend-item">
            <div class="legend-color rest"></div>
            <span>공휴일 / 주말</span>
          </div>
        </div>

        <div id="calendar-months-container">
          <!-- 선택된 카드의 연휴 달력이 렌더링됨 -->
        </div>
      </section>
    </main>

    <footer>
      <div class="nav-links" style="justify-content: center; margin-bottom: 12px;">
        <a href="./about.html">서비스 소개</a>
        <span style="color: var(--text-tertiary);">|</span>
        <a href="./privacy.html">개인정보처리방침</a>
        <span style="color: var(--text-tertiary);">|</span>
        <a href="./how-it-works.html">가이드</a>
      </div>
      <p>© 2026 연차최적화 계산기. All rights reserved.</p>
      <p style="font-size: 10px; margin-top: 4px;">공공데이터포털 한국천문연구원 특일 정보 데이터 참조.</p>
    </footer>
  </div>

  <script type="module">
    import { initApp } from './js/app.js';
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
